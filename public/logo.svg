<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2533"/>
      <stop offset="100%" stop-color="#0f1620"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e8c34a" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#2d3d52" stroke-width="1.5"/>

  <!-- Praesidium Shield Symbol -->
  <g filter="url(#glow)">
    <path
      d="M32 11 L48 17 V28.5 C48 39.5 40.5 48.2 32 51.5 C23.5 48.2 16 39.5 16 28.5 V17 Z"
      fill="url(#shieldFill)"
      stroke="url(#goldStroke)"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Central Civic Beacon -->
    <circle cx="32" cy="27" r="3.5" fill="#fef08a"/>
    <path
      d="M32 34 L32 42"
      stroke="#fef08a"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <path
      d="M27.5 38 L36.5 38"
      stroke="#fef08a"
      stroke-width="2.5"
      stroke-linecap="round"
    />
  </g>
</svg>
